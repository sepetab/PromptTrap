[project]
name = "prompttrap"
version = "0.1.0"
description = "Local-first document-safety scanner for prompt injection and hidden manipulation."
requires-python = ">=3.12"
dependencies = [
    "pdfminer.six",
    "pypdf",
    "pypdfium2",
    "pikepdf",
    "python-docx",
    "beautifulsoup4",
    "lxml",
    "tinycss2",
    "regex",
    "pillow",
    "pytesseract",
    "rapidfuzz",
    "faker",
    "reportlab",
]

[project.optional-dependencies]
viewer = ["streamlit"]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
